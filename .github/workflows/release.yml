name: Release
# Tạo bản cài đặt cho Windows, macOS, Linux, Android và bản web.
# Đẩy một tag dạng v0.1.0 để tạo GitHub Release kèm các tệp cài đặt.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
          - os: macos-latest
            flag: --mac
          - os: ubuntu-latest
            flag: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.flag }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/DVDDocs-${VERSION}-Android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk
          if-no-files-found: error

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out && (cd dist && zip -qr "../out/DVDDocs-${VERSION}-Web.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: out/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: DVDDocs ${{ github.ref_name }} (bản dùng thử)
          body_path: .github/release-notes.md
          prerelease: true
          files: artifacts/*
