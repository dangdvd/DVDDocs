name: Release
# Tạo bản cài đặt cho Windows, macOS, Linux, Android, iOS (IPA chưa ký) và bản web.
# Mỗi khi main có phiên bản mới (trường version trong package.json) chưa có Release,
# quy trình tự tạo tag vX.Y.Z và GitHub Release kèm các tệp cài đặt.
# Trên pull request chỉ build để kiểm tra, không phát hành.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml', 'package.json', 'electron/**', 'capacitor.config.json']
  workflow_dispatch:

permissions:
  contents: write

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
          - os: macos-latest
            flag: --mac
          - os: ubuntu-latest
            flag: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.flag }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/DVDDocs-${VERSION}-Android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk
          if-no-files-found: error

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx cap add ios
      - run: npx cap sync ios
      - name: Build IPA (chưa ký)
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then SRC="-workspace App.xcworkspace"; else SRC="-project App.xcodeproj"; fi
          xcodebuild $SRC -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 40
          cd "$GITHUB_WORKSPACE"
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/out/DVDDocs-${VERSION}-iOS-unsigned.ipa" Payload)
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: out/*.ipa
          if-no-files-found: error

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out && (cd dist && zip -qr "../out/DVDDocs-${VERSION}-Web.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: out/*.zip
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [desktop, android, ios, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      # Tạo Release nếu chưa có, rồi tải lên mọi tệp còn thiếu (có thử lại).
      # Chạy lại job này sẽ bổ sung các tệp bị lỗi tải lên ở lần trước.
      - name: Phát hành
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
              --title "DVDDocs $TAG (bản dùng thử)" --notes-file .github/release-notes.md
          fi
          have="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for f in artifacts/*; do
            name="$(basename "$f")"
            if grep -qxF "$name" <<<"$have"; then echo "Đã có $name"; continue; fi
            for n in 1 2 3 4; do
              if gh release upload "$TAG" "$f" --clobber; then echo "Đã tải lên $name"; break; fi
              [ "$n" = 4 ] && { echo "::error::Không tải lên được $name"; exit 1; }
              sleep $((n * 10))
            done
          done
